services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dhatri
      POSTGRES_PASSWORD: "KAy9YrGK6ZW16Y8t3vORYHQAuCxoVFdZ"
    volumes:
      - dhatri_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "ewx7FC0Qvw88CFl2r11lE9MotuNIshU7"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dhatri_test
      POSTGRES_PASSWORD: "M7uzzY80GQmJnyRuGoqrLdbEe4Ho2Kzj"
    volumes:
      - dhatri_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "EtALGM3fBLs9gt5HHz1KDlGIzJIr9611"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  dhatri_data:
  dhatri_test_data:
