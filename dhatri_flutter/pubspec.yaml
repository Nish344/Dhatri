name: dhatri_flutter
description: "Dhatri — AI-Assisted Remote-Care Companion for Elderly Patients, Caregivers & Doctors"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.12.2'
  flutter: ">=3.19.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  intl: ^0.19.0
  provider: ^6.1.2
  speech_to_text: ^6.6.0
  flutter_tts: ^4.2.0
  image_picker: ^1.1.2
  http: ^1.2.0
  dhatri_client:
    path: ../dhatri_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
